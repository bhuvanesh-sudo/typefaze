[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typefaze"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow>=10",
    "fonttools>=4.40",
    "torch>=2.1",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]
export = ["onnx", "onnxruntime"]

[tool.setuptools]
packages = ["typefaze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests"]
